# bragbit → .afk/config.yml
# Copy this to `.afk/config.yml` in hamedafarag/bragbit (Phase 0 onboarding).
# Machine-parsed and code-enforced — see PLAN.md §5.
version: 1

image: node:22 # corepack enables pnpm

commands:
  install: corepack enable && pnpm install --frozen-lockfile --ignore-scripts
  test: pnpm test # plain vitest — needs no env (test:db / e2e are off-limits in v0)
  lint: pnpm lint
  typecheck: pnpm typecheck
  build: pnpm build
  dev: pnpm dev

paths:
  allowed: ["src/**", "tests/**", "docs/**", "README.md"]
  blocked: ["scripts/**", "public/**", "marketing/**"]
  ignore:
    - "pnpm-lock.yaml"
    - "marketing/screenshots/**"
    - "**/*.snap"

limits:
  maxFilesChanged: 8
  maxDiffLines: 500
  maxCost: 2.00
  maxIterations: 10
  timeoutMinutes: 20

model:
  default: moonshotai/kimi-k2.5

preview:
  enabled: true
  requireLabel: afk-preview # mandatory — bragbit is public

# Phase 9 — before/after screenshots in the PR body. bragbit renders nothing without a
# database (src/lib/env.ts requires DATABASE_URL + BETTER_AUTH_SECRET at import; `/` and every
# (app) route query the DB), so the capture stack brings up a DISPOSABLE one on the task
# network and runs the repo's own db:push + seed:demo against it. No real credential is
# involved: these values are minted for a container that dies with the task, and the demo
# account is already committed in scripts/seed-demo.mjs. Applies to the dev-server container
# ONLY — the agent's job container still gets OPENROUTER_API_KEY and nothing else.
screenshot:
  enabled: true
  framework: next-app # derive routes from changed src/app/**/page.tsx; falls back to `routes`
  routes: ["/dashboard"] # used when a changed file maps to no URL (a shared component, CSS)
  port: 3000
  readySeconds: 420 # install + db:push + seed:demo + next dev cold compile
  services:
    - image: postgres:17-alpine
      alias: db
      env:
        POSTGRES_USER: afk
        POSTGRES_PASSWORD: afk
        POSTGRES_DB: app
  env:
    DATABASE_URL: postgres://afk:afk@db:5432/app
    BETTER_AUTH_SECRET: afk-screenshot-placeholder-0123456789abcdef
    APP_URL: http://app:3000
    INSTANCE_MODE: private-solo
  commands:
    migrate: pnpm db:push # drizzle-kit push — no migration files needed
    seed: pnpm seed:demo # idempotent, fixed ids; creates the demo owner below
  login:
    path: /sign-in
    email: demo@bragbit.local # committed demo credentials (scripts/seed-demo.mjs)
    password: demobragbit

pr:
  labels: ["afkgnt"]
